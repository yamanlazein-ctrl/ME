<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موتارد للأقمشة</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2433; --muted:#5b6476; --line:#e2e5eb; --brand:#1f4e8c; --warn:#a4262c; --warn-bg:#fdf3f3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --card:#1d222b; --ink:#e8ebf1; --muted:#a3abba; --line:#2d3340; --brand:#6ea3e8; --warn:#ff8a8f; --warn-bg:#2a1b1d; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font: 15px/1.7 "Segoe UI", Tahoma, sans-serif; }
  main { width:min(640px, calc(100vw - 32px)); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:32px; }
  h1 { margin:0 0 4px; font-size:22px; } .sub { color:var(--muted); margin:0 0 24px; font-size:13px; }
  .spin { width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:r 0.9s linear infinite; display:inline-block; vertical-align:middle; margin-left:10px; }
  @keyframes r { to { transform:rotate(360deg); } }
  .problem { background:var(--warn-bg); border:1px solid var(--warn); border-radius:8px; padding:14px 16px; margin:0 0 18px; }
  .problem b { color:var(--warn); } .code { font-family:Consolas, monospace; font-size:12px; color:var(--muted); direction:ltr; text-align:left; word-break:break-all; }
  .actions { display:grid; gap:10px; }
  button { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; text-align:right; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.danger { border-color:var(--warn); color:var(--warn); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  button small { display:block; color:var(--muted); font-size:12px; } button.primary small { color:#dfe9f7; }
  .confirm { display:none; margin-top:6px; gap:8px; } .confirm.open { display:flex; }
  .confirm input { flex:1; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  #msg { min-height:1.7em; color:var(--warn); margin-top:12px; }
  footer { margin-top:20px; color:var(--muted); font-size:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>موتارد للأقمشة</h1>
  <p class="sub">نظام إدارة المبيعات والمخزون والحسابات</p>

  <section id="starting">
    <p><span class="spin" aria-hidden="true"></span><span id="step" role="status">بدء التشغيل…</span></p>
  </section>

  <section id="recovery" hidden>
    <div class="problem" role="alert">
      <b id="title">تعذّر فتح بيانات الشركة</b>
      <p id="explain"></p>
      <div class="code" id="detail"></div>
    </div>
    <p>بياناتك لم تُحذف. اختر ما تريد فعله:</p>
    <div class="actions" id="actions"></div>
    <div id="msg" role="status"></div>
  </section>

  <footer>الإصدار <span id="ver"></span> · مجلد البيانات: <span id="root" class="code"></span></footer>
</main>
<script src="boot.js"></script>
</body>
</html>
