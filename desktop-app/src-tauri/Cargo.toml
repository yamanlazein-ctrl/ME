[package]
name = "motard-erp"
version = "3.0.6"
description = "Motard Fabrics Group ERP — Windows desktop application"
edition = "2021"
publish = false

[[bin]]
name = "motard-erp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "time", "sync", "macros"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
rfd = "0.15"
# Google Drive link (google.rs): HTTPS to Google's OAuth endpoints over the OS TLS stack (Schannel),
# so the system certificate store and proxies apply; no bundled crypto library.
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls"] }
native-tls = "=0.2.12"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Registry",
] }

[profile.release]
codegen-units = 4
lto = "thin"
strip = "symbols"
