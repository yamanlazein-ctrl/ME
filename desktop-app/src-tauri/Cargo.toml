[package]
name = "motard-erp"
version = "3.0.9"
description = "Motard Fabrics Group ERP — Windows desktop application"
edition = "2021"
publish = false

[[bin]]
name = "motard-erp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "time", "sync", "macros"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
rfd = "0.15"
# Google Drive link (google.rs): HTTPS to Google's OAuth endpoints over the OS TLS stack (Schannel),
# so the system certificate store and proxies apply; no bundled crypto library.
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls"] }
native-tls = "=0.2.12"
url = "2"

[target.'cfg(windows)'.dependencies]
# Phase 3 (pdf_render.rs): WebView2 PrintToPdf / CapturePreview. Pinned to the version tauri already
# links (cargo tree: webview2-com 0.39.1), so the build has one copy of it, not two.
webview2-com = "=0.39.1"
# windows-core 0.62: the COM types webview2-com hands us live in this crate, and the `#[implement]`
# macro that writes the COM callbacks expands to `::windows_core::…`, so the crate must be a DIRECT
# dependency under that exact name. The version matches webview2-com's (0.62).
windows-core = "0.62"
# 0.62 (not 0.61): webview2-com 0.39.1 is built against windows-core 0.62, so the COM types it
# hands us (ICoreWebView2_7, ICoreWebView2PrintSettings, the completion handlers) are windows-core
# 0.62 types. A 0.61 `windows` crate would be a DIFFERENT type universe and the interop would not
# compile. Aligning here also removes the duplicate 0.61/0.62 trees.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 4
lto = "thin"
strip = "symbols"
