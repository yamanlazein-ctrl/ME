name: mobile-emulator

# Re-runs only the emulator verification (FIX-05) on an APK a previous `mobile-android` run already built, so the flows and the
# test hub can be iterated in minutes instead of waiting for a full Gradle build.
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: "Run id of a mobile-android run whose motard-mobile-test-apk artifact to test"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - uses: actions/download-artifact@v4
        with:
          name: motard-mobile-test-apk
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Start PostgreSQL without fsync (throw-away test database)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
          for i in $(seq 1 40); do docker exec pg pg_isready -U postgres && break; sleep 2; done
      - name: Start the test hub (PostgreSQL + backend + generated data)
        env:
          CERT_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
          APP_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
          HUB_INFO: ${{ github.workspace }}/hub-info.json
        run: |
          nohup node scripts/emulator/start-test-hub.mjs > hub.out 2>&1 &
          HUB_PID=$!
          for i in $(seq 1 300); do
            grep -q HUB_READY hub.out && break
            kill -0 "$HUB_PID" 2>/dev/null || break
            sleep 5
          done
          echo "=== hub.out ==="; tail -40 hub.out
          grep -q HUB_READY hub.out
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=1.41.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run every screen on an emulator (screenshots, error scan, crash scan)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          disk-size: 8192M
          script: bash scripts/emulator/run-flows.sh apk/app-release.apk hub-info.json emulator-out
      - name: Upload screenshots, log and junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: |
            emulator-out
            hub.out
          retention-days: 14
