name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck backend
        run: npm run typecheck:backend

      # M-09: the root lint config ignores backend/**; this runs the backend's pg-import boundary.
      - name: Lint backend (pg import boundary, D-006)
        run: cd backend && npm run lint

      # DB-09: the desktop (production) engine's schema gate — tsc over the SQLite
      # test project, Drizzle schema regeneration check, and the committed
      # fingerprint. Drift used to be caught only locally or at boot.
      - name: SQLite typecheck + schema fingerprint gate (DB-09)
        run: cd backend && npm run typecheck:sqlite

      # T-05: the backend's production dependency set (what ships in the sidecar
      # bundle) is clean today, so it is a hard gate.
      - name: Backend production dependency audit (T-05)
        run: cd backend && npm audit --omit=dev --audit-level=high

      # T-05: the root tree is NOT clean today (seroval critical via
      # @tanstack/router-core; nanoid/source-map-js/js-yaml are build-time
      # tooling listed as prod deps). Advisory until those are upgraded.
      - name: Frontend production dependency audit (T-05, advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      # FND-1/FND-2: Drizzle migrations are the sole schema authority and the
      # journal must resolve every on-disk migration exactly once.
      - name: Migration and schema authority guards
        # Backend tests run under backend/vitest.config.ts — the root config only includes src/** (M-07).
        run: cd backend && npx vitest run tests/migrations-journal-guard.test.ts tests/schema-migration-parity.test.ts

      # Also collects packages/shared/src/**/*.test.ts (T-01: the shared
      # money-math suites were outside every include and had never run).
      - name: Run unit tests
        run: npm run test:logic

      # T-09: the desktop ships on SQLite, but CI only ran the backend suite in
      # PostgreSQL mode. test:sqlite runs it against a temp SQLite file.
      - name: Backend suite on SQLite (T-09)
        run: cd backend && npm run test:sqlite

      - name: Print blank-first-page contract (DFP-002)
        run: npx vitest run src/components/print/blankFirstPage.test.ts src/components/print/PrintDocument.header.test.tsx

      - name: Invitation atomic redeem unit gate (DFP-005 / DFP-006)
        run: cd backend && npx vitest run tests/invitation-atomic-redeem.test.ts tests/invitation-license-link.test.ts

      - name: Credential / lockfile / audit / backup fixture (DFP-029 / 032 / 031 / 028)
        run: npx vitest run src/dfp029-credentials.test.ts src/dfp032-lockfile.test.ts src/dfp031-audit-hygiene.test.ts src/dfp028-verify-fixture.test.ts

      - name: Loopback bind + refresh + FX schema (DFP-030 / DFP-038 / DFP-034)
        run: cd backend && npx vitest run tests/dfp030-loopback-bind.test.ts tests/dfp038-refresh-policy.test.ts tests/dfp034-fx-settlement-schema.test.ts

      - name: Fingerprint envelope contract (DFP-039)
        run: cd backend && npx vitest run tests/fingerprint.test.ts

      - name: SyncConflicts tenant guard + report contracts (DFP-019 / DFP-015)
        run: |
          (cd backend && npx vitest run tests/sync-conflicts-tenant-guard.test.ts)
          npx vitest run src/contracts/reports.dfp015.test.ts

      - name: Setup Python (Semgrep DFP-008)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Semgrep security gate (DFP-008)
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep
          semgrep scan --config .semgrep/rules.yml --error .

      - name: Frontend production build gate (DFP-008)
        run: npm run build

      - name: Provision Postgres + Redis for backend integration tests
        # The compose file requires these (`${VAR:?…}`) for every service it interpolates — test-only
        # values, the same ones the steps below use.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          APP_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
        run: |
          docker compose -f backend/docker-compose.yml up -d postgres redis
          # Dedicated test database. Locale C is the search-parity tests' contract (SQLite LIKE folds
          # ASCII only); the image default en_US.utf8 also folds ü/Ü (L-02).
          docker exec erp-postgres psql -U postgres -c "CREATE DATABASE erp_test TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C';"
          # Migrations apply against the test DB
          cd backend && DATABASE_URL=postgresql://postgres:postgres@localhost:5432/erp_test npm run db:migrate

      - name: Run backend integration tests
        run: cd backend && npx vitest run
        env:
          E2E_ADMIN_PASSWORD: CiTestAdmin!Pass9
          ALLOW_TEST_SEED: "1"
          NODE_ENV: test

      # FIN-08: behavioural sync proof against REAL Postgres. The static
      # text-shape assertions in sync-invariants.test.ts cannot catch a
      # refactor that preserves source text but breaks convergence.
      #
      # ADVISORY (continue-on-error) ON PURPOSE: the multi-device drill reuses
      # a template database and leaks state between scenarios, so its score
      # varies run to run (observed 17–27 of 33 on identical code). Making a
      # non-deterministic script a hard gate would fail honest PRs at random.
      # It runs on every build so regressions are visible in the log; promote
      # it to a blocking gate once the template is rebuilt per run.
      - name: Multi-device sync convergence drill (FIN-08 / S1–S8, advisory)
        continue-on-error: true
        run: cd backend && node scripts/verify-sync-multidevice.mjs
        env:
          NODE_ENV: test
          ALLOW_TEST_SEED: "1"
          JWT_SECRET: test-secret-32-chars-minimum-padding-paddingxx
          APP_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=

      - name: Restore/sync-state recovery drill (FIN-08, advisory)
        continue-on-error: true
        run: cd backend && node scripts/verify-restore-sync-state.mjs
        env:
          NODE_ENV: test
          ALLOW_TEST_SEED: "1"
          JWT_SECRET: test-secret-32-chars-minimum-padding-paddingxx
          APP_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=

      - name: Seed admin + API smoke gate (DFP-008)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
          E2E_ADMIN_PASSWORD: CiTestAdmin!Pass9
          ALLOW_TEST_SEED: "1"
          NODE_ENV: test
          JWT_SECRET: test-secret-32-chars-minimum-padding-paddingxx
          APP_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
          PORT: "8080"
          HOST: "127.0.0.1"
        run: |
          cd backend
          node seed-test-admin.mjs
          npx tsx src/presentation/server.ts > /tmp/erp-api.log 2>&1 &
          echo $! > /tmp/erp-api.pid
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8080/api/health/live >/dev/null; then
              echo "API ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/health/live
          cd ..
          npm run test:api
          kill "$(cat /tmp/erp-api.pid)" || true

      # DFP-031: M4/M5 flipped to `it(...)` — AUDIT_STRICT optional for audit-findings
      # when run via test:integration against a live API.
      - name: Lint
        run: npm run lint

      # TEMP-STAT-01: root lint ignores backend/**, so formatting drift there was never caught.
      - name: Formatting (prettier --check, whole repo)
        run: npx prettier --check .

      - name: Dependency audit (advisory)
        run: npm run clean:code || echo "Knip advisory only"

  # FIN-08: behavioural multi-device sync proof — blocking (not advisory).
  # Harness re-clones HUB/A/B from a migrated template between scenario groups
  # so leftover rows cannot leak and scores stay deterministic.
  sync-multidevice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: hub-sync-jwt-secret-key-min-32-chars!!
      APP_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Multi-device sync drill (FIN-08 blocking)
        working-directory: backend
        run: npm run test:sync-multidevice

  # Windows desktop shell (desktop-app/, ADR-001): keys, startup decision, pre-update copy,
  # pipe parser, env contract. The full installer lifecycle is tested by hand (see the
  # release readiness report); `tauri build` needs the licence signing key, which CI does not hold.
  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Minimal frontendDist for the compile (pages only)
        shell: bash
        run: |
          mkdir -p desktop-app/build/web desktop-app/build/resources
          cp desktop-app/src-tauri/pages/* desktop-app/build/web/
          cp desktop-app/src-tauri/resources/license-public.pem desktop-app/build/resources/

      # C-01: every command the UI invokes is registered, in build.rs APP_COMMANDS and granted.
      - name: Desktop IPC ACL parity
        run: node --test desktop-app/scripts/ipc-acl.test.mjs

      - name: Desktop shell unit tests
        working-directory: desktop-app/src-tauri
        run: cargo test
