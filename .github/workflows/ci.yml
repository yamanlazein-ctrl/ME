name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck backend
        run: npm run typecheck:backend

      - name: Run unit tests
        run: npm run test:logic

      - name: Provision Postgres + Redis for backend integration tests
        run: |
          docker compose -f backend/docker-compose.yml up -d postgres redis
          # Create a dedicated test database
          docker exec erp-postgres psql -U postgres -c "CREATE DATABASE erp_test;"
          # Migrations apply against the test DB
          cd backend && DATABASE_URL=postgresql://postgres:postgres@localhost:5432/erp_test npm run db:migrate

      - name: Run backend integration tests
        run: cd backend && npx vitest run

      - name: Lint
        run: npm run lint

      - name: Dependency audit (advisory)
        run: npm run clean:code || echo "Knip advisory only"
