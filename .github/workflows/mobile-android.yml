name: mobile-android

on:
  workflow_dispatch:
  push:
    branches: [feat/mobile]
    paths:
      - "mobile/**"
      - "backend/src/**"
      - "packages/shared/src/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: mobile
      - name: Typecheck, lint and unit tests (GATE-M)
        working-directory: mobile
        run: npx tsc --noEmit && npx eslint . --max-warnings 0 && npx vitest run
      - name: Prettier
        run: npx prettier --check mobile specs/002-mobile-app

  apk:
    needs: checks
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SPIKES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: mobile
      - name: Prebuild the Android project
        working-directory: mobile
        run: npm run prebuild:migrations && npx expo prebuild --platform android --no-install
      - name: Build the release APK (JavaScript bundled inside)
        working-directory: mobile/android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: motard-mobile-test-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
