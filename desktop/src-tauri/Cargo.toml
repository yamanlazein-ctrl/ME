[package]
name = "motard-fabrics-erp"
version = "1.0.0"
edition = "2021"
description = "Motard Fabrics Group ERP — Fabric & roll trading management system"
authors = ["Motard Fabrics Group"]
license = "Proprietary"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
hostname = "0.4"
tokio = { version = "1", features = ["full"] }
