# Enrolment, the first download, PIN sign-in and Home. Everything later depends on the state this flow leaves behind.
appId: com.motard.erp
name: 00 enroll, first download, sign in, Home
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "ربط الهاتف بالمركز"
    timeout: 90000
- takeScreenshot: 01-enroll
# QR scanner: opens, shows the frame and hint, and cancel returns to the form.
- tapOn: "مسح رمز QR"
- extendedWaitUntil:
    visible:
      id: "scan-cancel"
    timeout: 30000
- assertVisible:
    id: "scan-frame"
- takeScreenshot: 01b-scanner
- tapOn:
    id: "scan-cancel"
- assertVisible: "ربط الهاتف بالمركز"
# Unreachable hub: the network text. (Each check starts from a clean launch; erasing typed text is unreliable here.)
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "ربط الهاتف بالمركز"
    timeout: 90000
- tapOn:
    id: "hub"
- inputText: http://10.0.2.2:9
- tapOn:
    id: "code"
- inputText: SOME-CODE-0000
- hideKeyboard
- tapOn: "تسجيل"
- extendedWaitUntil:
    visible: "سيتابع عند عودة الاتصال"
    timeout: 60000
- takeScreenshot: 01d-unreachable-hub
# Wrong code on the real hub: refused with the invalid-code text.
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "ربط الهاتف بالمركز"
    timeout: 90000
- tapOn:
    id: "hub"
- inputText: ${HUB}
- tapOn:
    id: "code"
- inputText: WRONG-CODE-0000
- hideKeyboard
- tapOn: "تسجيل"
- extendedWaitUntil:
    visible: "رمز التسجيل غير صالح"
    timeout: 60000
- takeScreenshot: 01c-wrong-code
# The right hub and code.
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "ربط الهاتف بالمركز"
    timeout: 90000
- tapOn:
    id: "hub"
- inputText: ${HUB}
- tapOn:
    id: "code"
- inputText: ${CODE}
- hideKeyboard
- tapOn: "تسجيل"
- extendedWaitUntil:
    visible: "تسجيل الدخول"
    timeout: 300000
- assertNotVisible: ".*تعذّر.*"
- takeScreenshot: 02-login
- tapOn: "AC-8 Admin"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "✓"
- extendedWaitUntil:
    visible: "مبيعات اليوم"
    timeout: 90000
- assertNotVisible: ".*تعذّر.*"
- assertNotVisible:
    id: "home-error"
- assertNotVisible:
    id: "boot-error"
- assertVisible: "الرئيسية"
- takeScreenshot: 03-home
- extendedWaitUntil:
    visible: "تمت المزامنة"
    timeout: 180000
