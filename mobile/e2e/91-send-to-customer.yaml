appId: com.motard.erp
name: 91 send to customer asks for a phone when the party has none
---
- launchApp
- runFlow: unlock.yaml
# The generated customers have no phone number, so the prompt must appear.
- tapOn: "العملاء والموردون"
- extendedWaitUntil:
    visible:
      id: "party-row"
    timeout: 30000
- tapOn:
    id: "party-row"
- scrollUntilVisible:
    element: "كشف الحساب"
- tapOn: "كشف الحساب"
- extendedWaitUntil:
    visible: "إرسال الكشف للعميل"
    timeout: 30000
- tapOn: "إرسال الكشف للعميل"
- extendedWaitUntil:
    visible:
      id: "phone-prompt"
    timeout: 60000
- takeScreenshot: 96-send-phone-prompt
# A number that is too short is refused before anything is opened.
- tapOn:
    id: "send-phone"
- inputText: "12"
- hideKeyboard
- tapOn: "إرسال"
- assertVisible: "رقم الهاتف غير صالح"
- takeScreenshot: 97-send-invalid-phone
