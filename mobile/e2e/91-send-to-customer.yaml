appId: com.motard.erp
name: 91 send to customer asks for a phone when the party has none
---
- launchApp
- runFlow: unlock.yaml
- evalScript: ${output.stamp = String(Date.now()).slice(-7)}
- tapOn: "العملاء والموردون"
- tapOn: "طرف جديد"
- tapOn:
    id: "party-name"
- inputText: Nophone ${output.stamp}
- hideKeyboard
- tapOn: "حفظ"
- assertNotVisible:
    id: "party-error"
- tapOn:
    id: "party-search"
- inputText: Nophone ${output.stamp}
- tapOn:
    text: "Nophone ${output.stamp}.*"
    index: 1
- tapOn: "كشف الحساب"
- extendedWaitUntil:
    visible: "إرسال الكشف للعميل"
    timeout: 30000
- tapOn: "إرسال الكشف للعميل"
- extendedWaitUntil:
    visible:
      id: "phone-prompt"
    timeout: 60000
- takeScreenshot: 96-send-phone-prompt
# A number that is too short is refused before anything is opened.
- tapOn:
    id: "send-phone"
- inputText: "12"
- hideKeyboard
- tapOn: "إرسال"
- assertVisible: "رقم الهاتف غير صالح"
- takeScreenshot: 97-send-invalid-phone
- tapOn: "إلغاء الإرسال"
- assertNotVisible:
    id: "phone-prompt"
