appId: com.motard.erp
name: 89 customer order, cancel, and closing the day
---
- launchApp
- runFlow: unlock.yaml
- tapOn:
    id: "tab-more"
- tapOn:
    id: "more-orders"
- assertNotVisible:
    id: "state-error"
- takeScreenshot: 90-orders
- tapOn:
    id: "order-new"
- tapOn:
    id: "party-picker"
- tapOn:
    id: "party-option"
- tapOn:
    id: "order-fabric"
- inputText: Ordfab
- hideKeyboard
- tapOn:
    id: "order-color"
- inputText: Ordcolor
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "order-kg"
    centerElement: true
- tapOn:
    id: "order-kg"
- inputText: "25"
- hideKeyboard
- scrollUntilVisible:
    element: "إضافة البند"
    centerElement: true
- tapOn: "إضافة البند"
- scrollUntilVisible:
    element: "Ordfab · Ordcolor"
- takeScreenshot: 91-order-form
- tapOn:
    id: "order-save"
- extendedWaitUntil:
    visible:
      id: "order-row"
    timeout: 60000
- assertNotVisible:
    id: "order-error"
- takeScreenshot: 92-order-saved
- tapOn:
    id: "order-row"
- extendedWaitUntil:
    visible:
      id: "order-status"
    timeout: 30000
- takeScreenshot: 93-order-detail
- scrollUntilVisible:
    element: "إلغاء الطلبية"
- tapOn: "إلغاء الطلبية"
- tapOn:
    id: "confirm-yes"
- extendedWaitUntil:
    visible:
      id: "order-row"
    timeout: 60000
- takeScreenshot: 94-order-cancelled
# Closing the day: system balance, counted cash, the difference, confirmation.
- tapOn:
    id: "tab-more"
- tapOn:
    id: "more-closeDay"
- assertNotVisible:
    id: "close-day-denied"
- tapOn:
    id: "close-counted"
- inputText: "1"
- hideKeyboard
- assertVisible: "(زيادة|نقص) في الصندوق|لا فرق"
- takeScreenshot: 95-close-day
- tapOn:
    id: "close-day"
- assertVisible:
    id: "confirm-sheet"
- takeScreenshot: 95b-close-day-confirm
- tapOn:
    id: "confirm-no"
