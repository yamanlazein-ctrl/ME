appId: com.motard.erp
name: 70 sale on one screen, invoice page, share PDF, cancel
---
- launchApp
- runFlow: unlock.yaml
- tapOn:
    id: "tab-add"
- tapOn:
    id: "add-sale"
# An empty sale names its problems and saves nothing.
- tapOn:
    id: "sale-save"
- assertVisible:
    id: "sale-problems"
- tapOn:
    id: "party-picker"
- takeScreenshot: 14-sale-customer-sheet
- tapOn:
    id: "party-option"
- tapOn:
    id: "add-line"
- extendedWaitUntil:
    visible:
      id: "lot-option"
    timeout: 30000
- takeScreenshot: 15-lot-picker
- tapOn:
    id: "lot-option"
- assertVisible: "قطن تجريبي · أبيض"
# Edit the line: 2 kg.
- tapOn: "بند SEED-.*"
- tapOn:
    id: "line-kg"
- eraseText: 6
- inputText: "2"
- hideKeyboard
- takeScreenshot: 16-line-editor
- tapOn:
    id: "line-done"
- assertVisible: "صبغة SEED-.* · 2.00 كغ × .*"
# Leave the sale and come back: the draft (customer and line) is still there.
- tapOn:
    id: "screen-back"
- tapOn:
    id: "add-sale"
- assertVisible: "صبغة SEED-.* · 2.00 كغ × .*"
- takeScreenshot: 16b-draft-kept
# A rate is asked only if the customer pays in SYP.
- runFlow:
    when:
      visible:
        id: "sale-rate"
    commands:
      - tapOn:
          id: "sale-rate"
      - inputText: "14500"
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: "sale-due"
- takeScreenshot: 17-sale-totals
# A double tap saves once (the button is locked while saving; one done screen, one number).
- tapOn:
    id: "sale-save"
    repeat: 2
    delay: 50
- extendedWaitUntil:
    visible:
      id: "doc-done"
    timeout: 60000
- assertNotVisible:
    id: "sale-error"
- takeScreenshot: 18-sale-done
- tapOn: "عرض المستند"
- extendedWaitUntil:
    visible: "البنود.*"
    timeout: 30000
- takeScreenshot: 19-invoice
# Share the PDF: the system share sheet opens (no in-app error), then back to the invoice.
- scrollUntilVisible:
    element:
      id: "share-pdf"
- tapOn:
    id: "share-pdf"
- extendedWaitUntil:
    notVisible:
      id: "share-pdf"
    timeout: 60000
# The Android chooser shows the shared file itself: its name and the PDF type.
- extendedWaitUntil:
    visible: ".*Invoice-.*\\.pdf.*"
    timeout: 20000
- takeScreenshot: 20-share-sheet
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "share-result"
    timeout: 30000
- assertVisible: "فُتحت نافذة المشاركة.*"
- takeScreenshot: 20b-share-result
# Cancel the invoice: the themed confirmation, then the cancelled mark.
- scrollUntilVisible:
    element: "إلغاء الفاتورة"
- tapOn: "إلغاء الفاتورة"
- assertVisible:
    id: "confirm-sheet"
- takeScreenshot: 21-cancel-dialog
- tapOn:
    id: "confirm-yes"
- extendedWaitUntil:
    visible:
      id: "invoice-cancelled"
    timeout: 60000
- assertNotVisible:
    id: "invoice-error"
- takeScreenshot: 22-invoice-cancelled
