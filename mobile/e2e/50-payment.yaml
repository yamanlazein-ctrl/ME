appId: com.motard.erp
name: 50 payment to a supplier
---
- launchApp
- runFlow: unlock.yaml
- tapOn:
    id: "tab-add"
- tapOn:
    id: "add-payment"
- assertVisible: "دفع مال إلى مورد"
- tapOn:
    id: "party-picker"
- tapOn:
    id: "party-option"
- tapOn:
    id: "voucher-amount"
- inputText: "1"
- hideKeyboard
- tapOn:
    id: "voucher-method-transfer"
- takeScreenshot: 12-payment
- tapOn:
    id: "voucher-save"
- extendedWaitUntil:
    visible:
      id: "doc-done"
    timeout: 30000
- assertNotVisible:
    id: "voucher-error"
- takeScreenshot: 13-payment-done
