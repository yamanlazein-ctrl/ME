appId: com.motard.erp
name: 30 customers and suppliers, party page, statement by period
---
- launchApp
- runFlow: unlock.yaml
- tapOn:
    id: "tab-parties"
- assertVisible: "عميل 1"
- assertNotVisible:
    id: "state-error"
# Balances per currency with the desktop's side words.
- assertVisible: "مدين \\(على العميل\\)"
- takeScreenshot: 07-parties
- tapOn:
    id: "party-kind-supplier"
- assertNotVisible: "عميل 1"
- tapOn:
    id: "party-kind-"
- tapOn: "عميل 1"
- assertVisible:
    id: "party-balances"
- assertVisible: "بيع جديد"
- assertVisible: "سند قبض"
- takeScreenshot: 08-party
- scrollUntilVisible:
    element:
      id: "party-doc"
- takeScreenshot: 08b-party-documents
- tapOn:
    id: "party-docs-vouchers"
- assertNotVisible:
    id: "state-error"
- scrollUntilVisible:
    element:
      id: "party-statement"
    direction: UP
- tapOn:
    id: "party-statement"
- extendedWaitUntil:
    visible:
      id: "statement-closing"
    timeout: 30000
# The movements follow the period chips and the summary: below the fold on a small phone.
- scrollUntilVisible:
    element: "الحركات \\([0-9]+\\)"
    visibilityPercentage: 50
- assertVisible: "الحركات \\([0-9]+\\)"
- assertVisible: "فاتورة بيع .*"
- takeScreenshot: 09-statement
# A period with no movements is said plainly; back to all periods.
- scrollUntilVisible:
    element:
      id: "statement-period-lastMonth"
    direction: UP
- tapOn:
    id: "statement-period-lastMonth"
- assertNotVisible:
    id: "state-error"
- takeScreenshot: 09b-statement-period
- tapOn:
    id: "statement-period-all"
- extendedWaitUntil:
    visible:
      id: "statement-closing"
    timeout: 30000
# A statement line opens its invoice.
- scrollUntilVisible:
    element: "فاتورة بيع .*"
- tapOn: "فاتورة بيع .*"
- extendedWaitUntil:
    visible: "البنود.*"
    timeout: 30000
- takeScreenshot: 09c-statement-opens-invoice
# Back: the same statement, same period; back again: the party page; the tab returns to the list.
- tapOn:
    id: "screen-back"
# Back on the statement where the user left it (scrolled down to the line); up to the period and closing.
- scrollUntilVisible:
    element:
      id: "statement-period-all"
    direction: UP
- assertVisible:
    id: "statement-period-all"
    selected: true
- scrollUntilVisible:
    element:
      id: "statement-closing"
    visibilityPercentage: 50
- assertVisible:
    id: "statement-closing"
- tapOn:
    id: "screen-back"
- assertVisible:
    id: "party-balances"
- tapOn:
    id: "tab-parties"
- assertVisible:
    id: "party-search"
