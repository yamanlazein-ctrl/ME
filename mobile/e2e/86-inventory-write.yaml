appId: com.motard.erp
name: 86 dye-lot adjust and stock count
---
- launchApp
- runFlow: unlock.yaml
- tapOn:
    id: "tab-inventory"
- tapOn: "قطن تجريبي"
- tapOn:
    id: "color-row"
- tapOn: "صبغة SEED-.*"
- assertVisible:
    id: "lot-remaining"
# A valid adjust saves and the remaining kg changes.
- scrollUntilVisible:
    element:
      id: "adjust-open"
- tapOn:
    id: "adjust-open"
- scrollUntilVisible:
    element:
      id: "adjust-kg"
    centerElement: true
- tapOn:
    id: "adjust-kg"
- inputText: "1"
- hideKeyboard
- takeScreenshot: 44a-roll-adjust-filled
- scrollUntilVisible:
    element:
      id: "adjust-save"
    centerElement: true
- tapOn:
    id: "adjust-save"
- extendedWaitUntil:
    visible: "حُفظ التعديل.*"
    timeout: 30000
- assertNotVisible:
    id: "roll-error"
- scrollUntilVisible:
    element:
      id: "lot-remaining"
    direction: UP
- assertVisible: "1.00 كغ"
- takeScreenshot: 44-roll-adjusted
# Stock count from the inventory tab's header.
- tapOn:
    id: "tab-inventory"
- tapOn:
    id: "open-count"
- assertNotVisible:
    id: "state-error"
- extendedWaitUntil:
    visible:
      id: "count-line"
    timeout: 30000
- takeScreenshot: 45-count-sheet
- tapOn:
    id: "count-SEED-.*"
- inputText: "1"
- hideKeyboard
- tapOn: "تسجيل العدّ SEED-.*"
- extendedWaitUntil:
    visible: "تم تسجيل العدّ.*"
    timeout: 30000
- assertNotVisible:
    id: "count-error"
- takeScreenshot: 46-count-recorded
