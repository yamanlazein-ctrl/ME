appId: com.motard.erp
name: 87 purchase invoice with a new fabric and colour
---
- launchApp
- runFlow: unlock.yaml
- tapOn: "إضافة"
- tapOn: "فاتورة شراء"
- tapOn:
    id: "party-option"
- tapOn:
    id: "entry-rate"
- inputText: "1"
- hideKeyboard
- takeScreenshot: 70-entry-supplier
- tapOn: "التالي: البنود"
- tapOn: "إضافة بند"
- tapOn:
    id: "entry-fabric"
- inputText: Newfab
- hideKeyboard
- tapOn:
    id: "entry-color"
- inputText: Newcolor
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "entry-kg"
- tapOn:
    id: "entry-kg"
- inputText: "12"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "entry-pieces"
- tapOn:
    id: "entry-pieces"
- inputText: "2"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "entry-price"
- tapOn:
    id: "entry-price"
- inputText: "3"
- hideKeyboard
- takeScreenshot: 71-entry-line-form
- tapOn: "حفظ البند"
- assertVisible: "Newfab · Newcolor"
- takeScreenshot: 72-entry-lines
- tapOn: "التالي: المراجعة"
- assertVisible:
    id: "entry-total"
- takeScreenshot: 73-entry-review
- tapOn: "حفظ فاتورة الشراء"
- extendedWaitUntil:
    visible: "تم حفظ فاتورة الشراء.*"
    timeout: 60000
- assertNotVisible:
    id: "entry-error"
- takeScreenshot: 74-entry-done
- tapOn: "عرض الفاتورة"
- assertNotVisible: ".*تعذّر.*"
- takeScreenshot: 75-entry-invoice
# The new fabric is in the inventory with its 12 kg.
- pressKey: Back
- tapOn: "المخزون"
- assertVisible: "Newfab"
- assertVisible: "12.00 كغ · 1 لفة"
- takeScreenshot: 76-entry-stock
