- assertVisible: "سند قبض"
- takeScreenshot: 10-add-menu
- tapOn: "سند قبض"
- tapOn:
    id: "picker-search"
- inputText: "عميل 2"
- tapOn:
    id: "party-option"
- tapOn:
    id: "voucher-amount"
- inputText: "10"
- hideKeyboard
- takeScreenshot: 11-receipt
- tapOn: "حفظ سند القبض"
